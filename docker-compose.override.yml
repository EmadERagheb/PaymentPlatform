services:
  transactionsdb:
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123
    restart: always
    ports:
      - "1433:1433"
    volumes:
     - mssql_transactions:/var/opt/mssql

  paymentsdb:
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123
    restart: always
    ports:
      - "1435:1433"
    volumes:
      - mssql_payments:/var/opt/mssql
