services:
  transactionsdb:
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123
    restart: always
    ports:
      - "1433:1433"
    volumes:
     - mssql_transactions:/var/opt/mssql

  paymentsdb:
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123
    restart: always
    ports:
      - "1435:1433"
    volumes:
      - mssql_payments:/var/opt/mssql

  messagebroker:
    container_name: messagebroker
    hostname: payment-platform-messagebroker
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  transactions.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__DefaultConnection=Server=transactionsdb;User Id=sa;Password=Password123;Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__Username=guest
      - MessageBroker__Password=guest
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    depends_on:
      - transactionsdb
      - messagebroker

    ports:
      - "6001:8080"
      - "6051:8081"
    volumes:
      - ${APPDATA}/ASP.NET/Https:/https:ro

  payments.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__DefaultConnection=Server=paymentsdb;User Id=sa;Password=Password123;Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__Username=guest
      - MessageBroker__Password=guest
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    depends_on:
      - paymentsdb
      - messagebroker
    ports:
      - "6002:8080"
      - "6052:8081"
    volumes:
      - ${APPDATA}/ASP.NET/Https:/https:ro

  
