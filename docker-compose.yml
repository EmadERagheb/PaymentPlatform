services:
  transactionsdb:
    image: mcr.microsoft.com/mssql/server:2022-latest

  paymentsdb:
    image: mcr.microsoft.com/mssql/server:2022-latest

  messagebroker:
    image: rabbitmq:3-management-alpine

  payments.api:
    image: ${DOCKER_REGISTRY-}paymentsapi
    build:
      context: .
      dockerfile: src/Services/Payments/Payments.API/Dockerfile

  transactions.api:
    image: ${DOCKER_REGISTRY-}transactionsapi
    build:
      context: .
      dockerfile: src/Services/Transactions/Transactions.API/Dockerfile

# Named volumes persist DB data across 'docker-compose down'.
# Data is only removed if you run 'docker-compose down -v' (or --volumes).
volumes:
  mssql_transactions:
  mssql_payments:

